<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Notenheft</title>
<meta name="description" content="Offline-Notenheft für Lehrkräfte: Noten erfassen, Zeugnisnoten berechnen, Notizen für Elterngespräche." />

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#2F4F42" />

<!-- iOS: „Zum Home-Bildschirm“ als App-ähnliches Fenster ohne Browserleiste -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Notenheft" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" href="icons/icon-192.png" />

<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">Wird geladen …</div>

<script src="app.js" defer></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(function (err) {
        console.warn('Service Worker konnte nicht registriert werden:', err);
      });
    });
  }
</script>
</body>
</html>
